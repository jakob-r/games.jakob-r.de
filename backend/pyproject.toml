[project]
name = "games-platform"
version = "0.1.0"
description = "Multiplayer games platform backend (FastAPI + Psycopg 3 + WebSockets)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pywebpush>=2.5.0",
    "wordfreq>=3.1.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "httpx2>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["games_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
