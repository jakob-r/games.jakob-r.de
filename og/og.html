<!doctype html>
<!-- Source of frontend/static/og.png (share image). Render with `make og`. -->
<html>
<head>
<meta charset="utf-8" />
<style>
	@font-face { font-family: 'Architects Daughter'; src: url('../frontend/node_modules/@fontsource/architects-daughter/files/architects-daughter-latin-400-normal.woff2'); }
	@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; src: url('../frontend/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2'); }
	@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; src: url('../frontend/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2'); }
	html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #faf8f4; color: #1a1917; }
	body { position: relative; font-family: 'Plus Jakarta Sans', sans-serif; }
	.text { position: absolute; left: 80px; top: 150px; width: 520px; }
	h1 { font: 66px/1 'Architects Daughter', cursive; margin: 0; white-space: nowrap; }
	.rule { height: 4px; background: #1a1917; margin: 22px 0 26px; width: 470px; border-radius: 2px; transform: rotate(-0.6deg); }
	p { font-size: 30px; line-height: 1.35; margin: 0; color: #3b3832; }
	.chips { margin-top: 34px; display: flex; gap: 14px; }
	.chip { font-size: 22px; font-weight: 600; border: 2.5px solid #1a1917; border-radius: 8px; padding: 6px 14px; box-shadow: 3px 3px 0 #1a1917; background: #fff; }
	.card { position: absolute; background: #fff; border: 4px solid #1a1917; box-shadow: 7px 7px 0 #1a1917; }
	.hand { font-family: 'Architects Daughter', cursive; }
</style>
</head>
<body>
	<div class="text">
		<h1>games.jakob-r.de</h1>
		<div class="rule"></div>
		<p>Minimalistic multiplayer games.<br />Share a link, play together.</p>
		<div class="chips"><span class="chip">No ads</span><span class="chip">No tracking</span><span class="chip">Free</span></div>
	</div>

	<!-- Sudoku -->
	<div class="card" style="left: 660px; top: 70px; width: 240px; height: 240px; transform: rotate(-5deg);">
		<svg width="240" height="240" viewBox="0 0 240 240">
			<g stroke="#1a1917" stroke-linecap="round" fill="none">
				<path d="M80 4 L81 236 M160 3 L159 237 M4 80 L236 81 M3 160 L237 159" stroke-width="4" />
				<path d="M27 6 V234 M53 5 V235 M107 6 V234 M133 5 V235 M187 6 V234 M213 5 V235 M6 27 H234 M5 53 H235 M6 107 H234 M5 133 H235 M6 187 H234 M5 213 H235" stroke-width="1.2" opacity="0.35" />
			</g>
			<g class="hand" font-size="22" text-anchor="middle" fill="#1a1917" style="font-family: 'Architects Daughter'">
				<text x="15" y="23">5</text><text x="67" y="49">3</text><text x="120" y="23">7</text><text x="146" y="75">1</text>
				<text x="200" y="49">9</text><text x="40" y="128">6</text><text x="120" y="128">8</text><text x="226" y="102">4</text>
				<text x="15" y="182">2</text><text x="93" y="208">9</text><text x="173" y="182">3</text><text x="200" y="234">5</text>
				<text x="67" y="155" fill="#2f5bea">4</text><text x="173" y="128" fill="#2f5bea">2</text><text x="146" y="208" fill="#2f5bea">6</text>
			</g>
		</svg>
	</div>

	<!-- Dots and boxes -->
	<div class="card" style="left: 900px; top: 120px; width: 220px; height: 220px; transform: rotate(4deg);">
		<svg width="220" height="220" viewBox="0 0 220 220">
			<rect x="38" y="38" width="72" height="72" fill="#2f5bea" opacity="0.22" />
			<rect x="110" y="110" width="72" height="72" fill="#dc2626" opacity="0.18" />
			<g fill="none" stroke="#1a1917" stroke-width="5" stroke-linecap="round">
				<path d="M38 38 L110 39 L110 110 L38 110 Z" />
				<path d="M110 110 L182 111 L182 182 L110 182 Z" />
				<path d="M110 39 L182 38 M38 110 L38 182" />
			</g>
			<path d="M38 182 L108 182" stroke="#2f5bea" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 11" />
			<g fill="#1a1917">
				<circle cx="38" cy="38" r="7" /><circle cx="110" cy="38" r="7" /><circle cx="182" cy="38" r="7" />
				<circle cx="38" cy="110" r="7" /><circle cx="110" cy="110" r="7" /><circle cx="182" cy="110" r="7" />
				<circle cx="38" cy="182" r="7" /><circle cx="110" cy="182" r="7" /><circle cx="182" cy="182" r="7" />
			</g>
		</svg>
	</div>

	<!-- Minesweeper -->
	<div class="card" style="left: 700px; top: 345px; width: 200px; height: 200px; transform: rotate(3deg);">
		<svg width="200" height="200" viewBox="0 0 200 200">
			<g fill="#ece8df"><rect x="0" y="0" width="200" height="200" /></g>
			<g fill="#fff"><rect x="0" y="100" width="100" height="100" /><rect x="0" y="50" width="50" height="50" /><rect x="50" y="150" width="50" height="50" /><rect x="100" y="150" width="50" height="50" /></g>
			<g stroke="#1a1917" stroke-width="1.5" opacity="0.3"><path d="M50 0V200M100 0V200M150 0V200M0 50H200M0 100H200M0 150H200" /></g>
			<g class="hand" font-size="34" text-anchor="middle" style="font-family: 'Architects Daughter'">
				<text x="25" y="88" fill="#2f5bea">1</text><text x="75" y="138" fill="#2f5bea">1</text><text x="75" y="188" fill="#16a34a">2</text><text x="125" y="188" fill="#2f5bea">1</text>
			</g>
			<g transform="translate(125 125)" stroke="#1a1917" stroke-width="4" stroke-linecap="round" fill="none">
				<path d="M-8 16 V-16" /><path d="M-8 -16 L12 -8 L-8 0 Z" fill="#dc2626" />
			</g>
			<g transform="translate(175 75)"><circle r="12" fill="#1a1917" /><path d="M-18 0H18M0 -18V18M-13 -13L13 13M13 -13L-13 13" stroke="#1a1917" stroke-width="4" stroke-linecap="round" /></g>
		</svg>
	</div>

	<!-- Emoji charades -->
	<div class="card" style="left: 940px; top: 380px; width: 180px; height: 150px; transform: rotate(-4deg); display: grid; place-items: center;">
		<div style="font-size: 52px; letter-spacing: 6px;">🎬🦁👑</div>
		<div class="hand" style="font-size: 26px; margin-top: -18px;">? ? ?</div>
	</div>
</body>
</html>
