<!doctype html>
<!-- Source of the app icons (frontend/static/icon-*.png, apple-touch-icon.png). Render with `make icons`.
     Full-bleed background, drawing kept inside the central 80% so it also works as a maskable icon. -->
<html>
<head>
<meta charset="utf-8" />
<style>
	html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #faf8f4; }
	.card { position: absolute; left: 116px; top: 116px; width: 280px; height: 280px; background: #fff; border: 8px solid #1a1917; box-sizing: border-box; box-shadow: 12px 12px 0 #1a1917; transform: rotate(-4deg); }
</style>
</head>
<body>
	<div class="card">
		<svg width="264" height="264" viewBox="0 0 264 264">
			<rect x="42" y="42" width="90" height="90" fill="#2f5bea" opacity="0.25" />
			<rect x="132" y="132" width="90" height="90" fill="#dc2626" opacity="0.2" />
			<g fill="none" stroke="#1a1917" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
				<path d="M42 42 L132 43 L132 132 L42 132 Z" />
				<path d="M132 132 L222 133 L222 222 L132 222 Z" />
				<path d="M132 43 L222 42" />
			</g>
			<path d="M42 222 L118 222" stroke="#2f5bea" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16" />
			<g fill="#1a1917">
				<circle cx="42" cy="42" r="11" /><circle cx="132" cy="42" r="11" /><circle cx="222" cy="42" r="11" />
				<circle cx="42" cy="132" r="11" /><circle cx="132" cy="132" r="11" /><circle cx="222" cy="132" r="11" />
				<circle cx="42" cy="222" r="11" /><circle cx="132" cy="222" r="11" /><circle cx="222" cy="222" r="11" />
			</g>
		</svg>
	</div>
</body>
</html>
