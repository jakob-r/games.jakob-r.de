	html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #faf8f4; }
</style>
</head>
<body>

	<script>
		if (location.search.includes('any')) document.getElementById('art').setAttribute('transform', 'translate(250 250) scale(1.24) translate(-256 -256) rotate(-6 256 256)');
	</script>

</html>
